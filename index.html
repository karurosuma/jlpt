<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JLPT 自習アプリ N5〜N1</title>
<link rel="stylesheet" href="style.css?v=20261104s">
</head>
<body>
<div class="top-bar">
  <button class="search-btn" onclick="openSearch()" aria-label="検索">🔍</button>
  <h1 id="topTitle">単語</h1>
  <button class="gear-btn" onclick="openSettings()" aria-label="設定">⚙️</button>
</div>

<div id="content"><p style="text-align:center;padding:40px 16px;color:#8e8e93;">レベルを選択してください。<br>請選擇級別。</p></div>

<div class="tab-bar">
  <button id="tab-words" class="active" onclick="switchTab('words')">
    <div class="icon">📖</div>
    単語
  </button>
  <button id="tab-grammar" onclick="switchTab('grammar')">
    <div class="icon">📝</div>
    文法
  </button>
  <button id="tab-exercises" onclick="switchTab('exercises')">
    <div class="icon">✏️</div>
    練習
  </button>
</div>

<!-- Search Overlay -->
<div class="search-overlay" id="searchOverlay" onclick="closeSearch()">
  <div class="search-panel" onclick="event.stopPropagation()">
    <input type="text" id="searchInput" placeholder="検索 / 搜尋" oninput="doSearch(this.value)">
    <div id="searchResults"></div>
  </div>
</div>
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()">
  <div class="settings-panel" onclick="event.stopPropagation()">
    <div class="settings-header">
      <h2>設定 / 設定</h2>
      <button class="close-btn" onclick="closeSettings()">完了</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">外観 / 外觀</div>
      <button class="action" id="darkToggle" onclick="toggleDark()">ダークモード切替</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">レベル選択 / 級別選擇</div>
      <div class="level-btns" id="levelNav"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">データベース / 資料庫</div>
      <button class="action" onclick="document.getElementById('status').innerText='ローカル./data を優先します。キャッシュも使用可能です。'">データ読み込みについて</button>
      <button class="action" onclick="exportUserDB()">進捗と設定をエクスポート</button>
      <input type="file" id="importUser" accept=".db,.sqlite" style="display:none" onchange="importUserDB(this)">
      <button class="action" onclick="document.getElementById('importUser').click()">進捗をインポート</button>
      <div id="status">v2026-11-04c - レベル選択時に ./data から読み込みます。</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
