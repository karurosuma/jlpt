<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JLPT 自習アプリ N5〜N1</title>
<link rel="stylesheet" href="style.css?v=20261106l">
</head>
<body>
<div class="top-bar">
  <button class="search-btn" onclick="openSearch()" aria-label="検索">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  <h1 id="topTitle">単語</h1>
  <button class="theme-btn" id="themeBtn" onclick="toggleDark()" aria-label="テーマ切替">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>

<div id="content"><p style="text-align:center;padding:40px 16px;color:#8e8e93;">レベルを選択してください。<br>請選擇級別。</p></div>

<div class="tab-bar">
  <button id="tab-words" class="active" onclick="switchTab('words')">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
    単語
  </button>
  <button id="tab-grammar" onclick="switchTab('grammar')">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
    文法
  </button>
  <button id="tab-exercises" onclick="switchTab('exercises')">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
    練習
  </button>
  <button id="tab-conversation" onclick="switchTab('conversation')">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    会話
  </button>
  <button id="tab-settings" onclick="switchTab('settings')">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    設定
  </button>
</div>

<!-- Search Overlay -->
<div class="search-overlay" id="searchOverlay" onclick="closeSearch()">
  <div class="search-panel" onclick="event.stopPropagation()">
    <input type="text" id="searchInput" placeholder="検索 / 搜尋" oninput="doSearch(this.value)">
    <div id="searchResults"></div>
  </div>
</div>
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()">
  <div class="settings-panel" onclick="event.stopPropagation()">
    <div class="settings-header">
      <h2>設定</h2>
      <button class="close-btn" onclick="closeSettings()">完了</button>
    </div>
    <div class="settings-content">
      <div class="settings-section">
        <div class="settings-section-header">表示設定</div>
        <div class="settings-group">
          <div class="settings-item">
            <span class="settings-icon orange">📚</span>
            <span class="settings-label">レベル別に表示</span>
            <div class="ios-toggle active" id="levelFilterToggle" onclick="toggleLevelFilter()"></div>
          </div>
        </div>
      </div>
      <div class="settings-section" id="levelSection">
        <div class="settings-section-header">レベル選択</div>
        <div class="settings-group" id="levelNav"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-header">学習</div>
        <div class="settings-group">
          <div class="settings-item" onclick="showSummary()">
            <span class="settings-icon green">📊</span>
            <span class="settings-label">学習進捗</span>
            <span class="settings-chevron">›</span>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-header">データ管理</div>
        <div class="settings-group">
          <div class="settings-item" onclick="openCMS()">
            <span class="settings-icon blue">✏️</span>
            <span class="settings-label">内容を管理</span>
            <span class="settings-chevron">›</span>
          </div>
          <div class="settings-item" onclick="exportContentDB()">
            <span class="settings-icon orange">📤</span>
            <span class="settings-label">内容をエクスポート</span>
            <span class="settings-chevron">›</span>
          </div>
          <div class="settings-item" onclick="exportUserDB()">
            <span class="settings-icon purple">💾</span>
            <span class="settings-label">進捗をエクスポート</span>
            <span class="settings-chevron">›</span>
          </div>
          <input type="file" id="importUser" accept=".db,.sqlite" style="display:none" onchange="importUserDB(this)">
          <div class="settings-item" onclick="document.getElementById('importUser').click()">
            <span class="settings-icon gray">📥</span>
            <span class="settings-label">進捗をインポート</span>
            <span class="settings-chevron">›</span>
          </div>
        </div>
      </div>
      <div id="status" class="settings-footer">レベル選択時にデータを読み込みます。</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
