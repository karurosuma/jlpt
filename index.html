<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JLPT 自習アプリ N5〜N1</title>
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --primary: #007aff;
  --text: #000000;
  --muted: #8e8e93;
  --separator: #c6c6c8;
  --tab-bar-bg: rgba(249,249,249,0.94);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg: #000000;
  --card: #1c1c1e;
  --primary: #0a84ff;
  --text: #ffffff;
  --muted: #8e8e93;
  --separator: #38383a;
  --tab-bar-bg: rgba(28,28,30,0.94);
}
body.light {
  --bg: #f2f2f7;
  --card: #ffffff;
  --primary: #007aff;
  --text: #000000;
  --muted: #8e8e93;
  --separator: #c6c6c8;
  --tab-bar-bg: rgba(249,249,249,0.94);
}
@media (prefers-color-scheme: dark) {
  :root:not(.light):not(body.light) {
    --bg: #000000;
    --card: #1c1c1e;
    --primary: #0a84ff;
    --text: #ffffff;
    --muted: #8e8e93;
    --separator: #38383a;
    --tab-bar-bg: rgba(28,28,30,0.94);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;
  font-size: 17px;
  line-height: 1.4;
  overflow-x: hidden;
}
/* Fixed Top Bar - account for safe area properly */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  min-height: 44px;
  background: rgba(249,249,249,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(8px + var(--safe-top)) 12px 8px 12px;
  z-index: 100;
}
.top-bar h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
  line-height: 1.2;
}
.gear-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 6px 8px;
  color: var(--primary);
  min-width: 40px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Content area - leave space for top bar */
#content {
  padding: calc(60px + var(--safe-top)) 0 calc(70px + var(--safe-bottom)) 0;
  min-height: 100vh;
}
/* Bottom Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(49px + var(--safe-bottom));
  background: var(--tab-bar-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex;
  z-index: 100;
  padding-bottom: var(--safe-bottom);
}
.tab-bar button {
  flex: 1;
  border: none;
  background: none;
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 4px 0 2px 0;
}
.tab-bar button.active {
  color: var(--primary);
}
.tab-bar button .icon { font-size: 24px; line-height: 1; }
/* Cards */
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin: 8px 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.word { font-size: 20px; font-weight: 600; }
.reading { color: var(--primary); margin-left: 6px; font-size: 15px; font-weight: 400; }
button.action {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin: 6px 4px;
}
/* Settings Overlay */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: none;
  align-items: flex-end;
}
.settings-overlay.show { display: flex; }
.settings-panel {
  background: var(--bg);
  width: 100%;
  border-radius: 14px 14px 0 0;
  max-height: 85vh;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.settings-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.settings-header h2 { margin: 0; font-size: 20px; }
.close-btn { background: none; border: none; font-size: 17px; color: var(--primary); cursor: pointer; }
.level-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.level-btns button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: rgba(120,120,128,0.12);
  font-size: 15px;
  cursor: pointer;
}
.level-btns button.active { background: var(--primary); color: #fff; }
#status { font-size: 13px; color: var(--muted); margin: 10px 0; }
.part {
  display: inline-block;
  margin: 4px;
  padding: 8px 12px;
  background: rgba(0,122,255,0.12);
  color: var(--primary);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
}
.part.used { opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>
<div class="top-bar">
  <div style="width:40px;flex-shrink:0;"></div>
  <h1 id="topTitle">単語</h1>
  <button class="gear-btn" onclick="openSettings()" aria-label="設定">⚙️</button>
</div>

<div id="content"><p style="text-align:center;padding:40px 16px;color:#8e8e93;">レベルを選択してください。<br>請選擇級別。</p></div>

<div class="tab-bar">
  <button id="tab-words" class="active" onclick="switchTab('words')">
    <div class="icon">📖</div>
    単語
  </button>
  <button id="tab-grammar" onclick="switchTab('grammar')">
    <div class="icon">📝</div>
    文法
  </button>
  <button id="tab-exercises" onclick="switchTab('exercises')">
    <div class="icon">✏️</div>
    練習
  </button>
</div>

<!-- Settings Overlay -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()">
  <div class="settings-panel" onclick="event.stopPropagation()">
    <div class="settings-header">
      <h2>設定 / 設定</h2>
      <button class="close-btn" onclick="closeSettings()">完了</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">外観 / 外觀</div>
      <button class="action" id="darkToggle" onclick="toggleDark()">ダークモード切替</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">レベル選択 / 級別選擇</div>
      <div class="level-btns" id="levelNav"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px;">データベース / 資料庫</div>
      <button class="action" onclick="fetchLatestDB()">最新DBを取得</button>
      <button class="action" onclick="exportUserDB()">進捗と設定をエクスポート</button>
      <input type="file" id="importUser" accept=".db,.sqlite" style="display:none" onchange="importUserDB(this)">
      <button class="action" onclick="document.getElementById('importUser').click()">進捗をインポート</button>
      <div id="status">レベル選択時にオンライン優先で取得します。</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
let SQL = null;
let contentDB = null;
let userDB = null;
let currentLevel = 'N5';
let currentTab = 'words';

const LEVELS = ['N5','N4','N3','N2','N1'];
const ONLINE_BASE = "https://karurosuma.github.io/jlpt/data/";

async function init() {
  try {
    SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
    userDB = new SQL.Database();
    userDB.run(`CREATE TABLE IF NOT EXISTS progress (
      level TEXT, type TEXT, item_id INTEGER,
      status TEXT DEFAULT 'new', last_reviewed TEXT,
      PRIMARY KEY(level, type, item_id)
    )`);
    userDB.run(`CREATE TABLE IF NOT EXISTS quiz_history (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      level TEXT, quiz_type TEXT, score INTEGER, total INTEGER, date TEXT
    )`);
    userDB.run(`CREATE TABLE IF NOT EXISTS preferences (
      key TEXT PRIMARY KEY,
      value TEXT
    )`);
    // Load preferences from DB if present
    try {
      const pref = userDB.exec("SELECT value FROM preferences WHERE key='theme'");
      if (pref.length && pref[0].values.length) {
        localStorage.setItem('theme', pref[0].values[0][0]);
      }
    } catch(e) {}
  } catch(e) { console.error(e); }
  // Theme
  const theme = localStorage.getItem('theme');
  document.body.classList.remove('dark', 'light');
  if (theme === 'dark') document.body.classList.add('dark');
  else if (theme === 'light') document.body.classList.add('light');
  updateDarkButton();
  renderLevelNav();
  switchTab('words');
}

function openSettings() {
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('show');
}
function toggleDark() {
  const body = document.body;
  const current = localStorage.getItem('theme') || 'auto';
  let newTheme;
  if (current === 'auto' || current === 'light') {
    body.classList.remove('light');
    body.classList.add('dark');
    newTheme = 'dark';
  } else {
    body.classList.remove('dark');
    body.classList.add('light');
    newTheme = 'light';
  }
  localStorage.setItem('theme', newTheme);
  if (userDB) {
    try {
      userDB.run("INSERT OR REPLACE INTO preferences (key, value) VALUES ('theme', ?)", [newTheme]);
    } catch(e) {}
  }
  updateDarkButton();
}
function updateDarkButton() {
  const btn = document.getElementById('darkToggle');
  if (!btn) return;
  const theme = localStorage.getItem('theme') || 'auto';
  if (theme === 'dark') btn.textContent = 'ライトモードに切替';
  else if (theme === 'light') btn.textContent = 'ダークモードに切替';
  else btn.textContent = 'ダークモードに切替';
}

function renderLevelNav() {
  const nav = document.getElementById('levelNav');
  nav.innerHTML = '';
  LEVELS.forEach(lv => {
    const btn = document.createElement('button');
    btn.textContent = lv;
    btn.className = lv === currentLevel ? 'active' : '';
    btn.onclick = () => { currentLevel = lv; loadLevel(lv); closeSettings(); };
    nav.appendChild(btn);
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const titles = { words: '単語', grammar: '文法', exercises: '練習' };
  document.getElementById('topTitle').textContent = titles[tab] || 'JLPT';
  renderContent();
}

async function loadLevel(level) {
  currentLevel = level;
  renderLevelNav();
  const fname = level.toLowerCase() + '.db';
  let loaded = false;
  try {
    const resp = await fetch(ONLINE_BASE + fname, { cache: 'no-store' });
    if (resp.ok) {
      const buf = await resp.arrayBuffer();
      contentDB = new SQL.Database(new Uint8Array(buf));
      document.getElementById('status').innerText = `${level} をオンラインから取得`;
      loaded = true;
    }
  } catch(e) {}
  if (!loaded) {
    try {
      const resp = await fetch(fname);
      if (resp.ok) {
        const buf = await resp.arrayBuffer();
        contentDB = new SQL.Database(new Uint8Array(buf));
        document.getElementById('status').innerText = `${level} をローカルから読み込み`;
        loaded = true;
      }
    } catch(e) {}
  }
  if (!loaded) {
    document.getElementById('status').innerText = `${fname} が見つかりません`;
    contentDB = null;
  }
  renderContent();
}

function renderContent() {
  const c = document.getElementById('content');
  if (!contentDB) {
    c.innerHTML = '<p style="text-align:center;padding:40px;color:#8e8e93;">データがありません。<br>設定からレベルを選択してください。</p>';
    return;
  }
  if (currentTab === 'words') showWords(c);
  else if (currentTab === 'grammar') showGrammar(c);
  else if (currentTab === 'exercises') showExercises(c);
}

function showWords(container) {
  try {
    const rows = contentDB.exec("SELECT * FROM vocab LIMIT 200");
    if (!rows.length) { container.innerHTML = '<p style="text-align:center;padding:40px;">語彙データなし</p>'; return; }
    let html = '';
    rows[0].values.forEach(r => {
      html += `<div class="card"><div class="word">${r[1]} <span class="reading">${r[2]||''}</span></div>
        <div style="margin-top:6px;color:#666;">${r[3]} / ${r[4]}</div>
        <div style="margin-top:6px;font-size:15px;color:#333;">例：${r[5]||''}</div></div>`;
    });
    container.innerHTML = html;
  } catch(e) { container.innerHTML = '<p>語彙テーブルがありません</p>'; }
}

function showGrammar(container) {
  try {
    const rows = contentDB.exec("SELECT * FROM grammar");
    if (!rows.length) { container.innerHTML = '<p style="text-align:center;padding:40px;">文法データなし</p>'; return; }
    let html = '';
    rows[0].values.forEach(r => {
      html += `<div class="card"><div class="word">${r[1]}</div>
        <div style="margin-top:8px;">${r[2]}<br><span style="color:#666;">${r[3]}</span></div>
        <div style="margin-top:8px;font-size:15px;">${(r[4]||'').split('|').map(e=>'・'+e).join('<br>')}</div></div>`;
    });
    container.innerHTML = html;
  } catch(e) { container.innerHTML = '<p>文法テーブルがありません</p>'; }
}

function showExercises(container) {
  try {
    const rows = contentDB.exec("SELECT * FROM rearrange ORDER BY RANDOM() LIMIT 8");
    if (!rows.length) { container.innerHTML = '<p style="text-align:center;padding:40px;">練習問題がありません</p>'; return; }
    let html = '<div style="padding:8px 16px;font-weight:600;">並べ替え問題 / 句子重組</div>';
    rows[0].values.forEach((r, idx) => {
      const parts = r[2].split('|');
      html += `<div class="card" id="rearr-${idx}">
        <div style="margin-bottom:8px;font-size:15px;color:#666;">正しい文を作ってください</div>
        <div id="parts-${idx}">${parts.map(p => `<span class="part" onclick="addPart(${idx}, this)">${p}</span>`).join('')}</div>
        <div id="answer-${idx}" style="margin:12px 0;min-height:2em;border-bottom:1px solid #ddd;padding:4px;"></div>
        <button class="action" onclick="checkRearrange(${idx}, '${r[1].replace(/'/g,"\\'")}')">確認</button>
        <div id="feedback-${idx}" style="margin-top:8px;"></div>
      </div>`;
    });
    container.innerHTML = html;
  } catch(e) { container.innerHTML = '<p>並べ替え問題がありません</p>'; }
}

function addPart(idx, el) {
  if (el.classList.contains('used')) return;
  el.classList.add('used');
  document.getElementById('answer-' + idx).innerHTML += `<span class="part">${el.textContent}</span> `;
}
function checkRearrange(idx, correct) {
  const user = document.getElementById('answer-' + idx).innerText.replace(/\s+/g,'').trim();
  const fb = document.getElementById('feedback-' + idx);
  if (user === correct.replace(/\s+/g,'')) {
    fb.innerHTML = '<span style="color:#34c759;">正解！</span>';
  } else {
    fb.innerHTML = `<span style="color:#ff3b30;">不正解。正解：${correct}</span>`;
  }
}

async function fetchLatestDB() {
  const url = prompt('最新DBのURL', ONLINE_BASE + currentLevel.toLowerCase() + '.db');
  if (!url) return;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(resp.status);
    const buf = await resp.arrayBuffer();
    contentDB = new SQL.Database(new Uint8Array(buf));
    document.getElementById('status').innerText = '最新データを取得しました';
    closeSettings();
    renderContent();
  } catch(e) { alert('取得失敗: ' + e.message); }
}
function exportUserDB() {
  if (!userDB) return;
  const data = userDB.export();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = 'user_progress.db';
  a.click();
}
function importUserDB(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      userDB = new SQL.Database(new Uint8Array(e.target.result));
      // Restore theme from imported DB
      try {
        const pref = userDB.exec("SELECT value FROM preferences WHERE key='theme'");
        if (pref.length && pref[0].values.length) {
          const theme = pref[0].values[0][0];
          localStorage.setItem('theme', theme);
          document.body.classList.remove('dark', 'light');
          if (theme === 'dark') document.body.classList.add('dark');
          else if (theme === 'light') document.body.classList.add('light');
          updateDarkButton();
        }
      } catch(err) {}
      document.getElementById('status').innerText = '進捗と設定をインポートしました';
      renderContent();
    } catch(err) { alert('インポート失敗'); }
  };
  reader.readAsArrayBuffer(file);
}

init();
</script>
</body>
</html>
